[workspace]
resolver = "3"
members = [
    "crates/nyx-clipboard-core",
    "crates/nyx-clipboard-store",
    "crates/nyx-clipboard-dbus",
    "apps/daemon",
    "apps/popup",
    "apps/settings",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ken Smith"]
repository = "https://github.com/design-nexus/nyx-clipboard"

[workspace.dependencies]
nyx-clipboard-core = { path = "crates/nyx-clipboard-core" }
nyx-clipboard-store = { path = "crates/nyx-clipboard-store" }
nyx-clipboard-dbus = { path = "crates/nyx-clipboard-dbus" }
anyhow = "1"
blake3 = "1"
libc = "0.2"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
zeroize = "1"
# The default async-io runtime, as in the rest of the suite.
zbus = "5"
wl-clipboard-rs = "0.9.4"
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
gtk4-layer-shell = "0.8"
nyx-peer = { git = "https://github.com/design-nexus/nyx-core.git", rev = "0f1c0e8f0359a58f2d702180f34dafffafe3db44" }
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "9dc196245bbf0ccc93b8bf04ac61bb476b85e4d5", default-features = false }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "976fed940841a2a505ffe644f632cb60e12988a8" }

[profile.release]
lto = "thin"
strip = true
